[package]
name = "merlin-desktop"
version = "0.1.0"
description = "Merlin no desktop: o site publicado numa janela, o rastreador por cima e a bandeja"
edition = "2021"

[lib]
name = "merlin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# so existem no desktop. o celular (VISAO, 8.5) vem depois e por outro caminho
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
