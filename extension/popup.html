<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Merlin</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  input, textarea, button { font: inherit; width: 100%; box-sizing: border-box; }
  input, textarea {
    padding: 8px; border: 1px solid rgba(127,127,127,.4); border-radius: 8px;
    margin-bottom: 8px; background: transparent; color: inherit;
  }
  textarea { resize: vertical; min-height: 90px; }
  button {
    padding: 8px; border: none; border-radius: 8px; background: #22c55e;
    color: #06210f; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: none; color: #888; font-weight: 400; width: auto; padding: 4px; }
  p.hint { color: #888; margin: 2px 0 10px; }
  p.error { color: #ef4444; margin: 4px 0 0; min-height: 1em; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/popup.js"></script>
</body>
</html>
