# todo merge na main vai para produção sozinho. o `npm run deploy` roda o mesmo
# portão do CI antes de publicar: teste quebrado não sobe.
# o token só publica o worker (Workers Scripts + Workers Routes na zona
# arttreis.com.br). os segredos do app seguem no `wrangler secret`.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# um deploy por vez e sem cancelar o que já começou: dois merges seguidos
# publicam em ordem, e o último ganha.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
