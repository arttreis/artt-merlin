<!-- Sora e a mono sao do Merlin; DM Sans, Manrope e a Instrument Serif sao da
     Guessless (html.gl). o navegador so baixa os arquivos das familias que a
     marca ativa usar: o que cresce aqui e a folha de estilo, nao a pagina. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<script>/* o tema E a marca antes da primeira pintura: sem isto, quem e da casa
   ve um quadro de Merlin antes do proprio Merlin. a marca sai do e-mail com
   que a pessoa entrou, e o core a grava em merlin:brand. */
try{var t=localStorage.getItem("merlin:theme");if(t?t==="light":matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("light");
var b=localStorage.getItem("merlin:brand");if(b&&/^[a-z]{2,12}$/.test(b)){document.documentElement.classList.add(b);
if(b==="gl"){var l=document.querySelector("link[rel=icon]");if(l)l.href="/guessless-isotipo.svg"}}}catch(e){}</script>
