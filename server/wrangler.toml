# o nome do worker e so um rotulo interno na Cloudflare, e os segredos ficam
# presos a ele: renomear para "merlin-api" criaria um worker novo, sem a chave
# do Resend e sem o segredo de sessao. por isso o nome antigo fica.
name = "artt-planner-api"
main = "worker.js"
compatibility_date = "2026-09-01"

# o site e a api saem do mesmo worker, no mesmo dominio: e isso que permite
# cookie SameSite=Lax. em dominios separados o cookie seria de terceiro, e
# Safari e Firefox o bloqueiam — o login nao gruda.
#
# custom_domain, e nao route: a Cloudflare reserva route para quando existe
# uma origem externa. aqui o worker E a origem, e o custom domain cria o
# registro DNS e o certificado sozinho — nada a configurar no painel.
[[routes]]
pattern = "merlin.arttreis.com.br"
custom_domain = true

# so o que e publico entra aqui. apontar para a raiz do projeto publicaria
# o worker.js, o schema e os testes junto — "npm run site" copia as paginas
# e a pasta shared/ da raiz para ca, e a raiz segue sendo a fonte unica.
[assets]
directory = "./site"
# o binding permite ao worker devolver um arquivo estatico quando o caminho
# nao e /api/ — sem ele, env.ASSETS nao existe
binding = "ASSETS"

[[d1_databases]]
# o nome pelo qual o worker alcanca o banco: env.DB.
# se mudar aqui, tem que mudar no worker.js junto. o database_name e o
# recurso na Cloudflare e nao mudou de nome (mudar criaria outro banco).
binding = "DB"
database_name = "artt-planner"
database_id = "9011ef3f-3d1d-4019-8db9-c5ff07df0446"

# onde moram os prints anexados as ideias. o binario nao cabe no documento:
# ele subiria e desceria inteiro a cada sincronizacao. aqui fica o arquivo, e
# o documento guarda so o bilhete. a chave de todo objeto comeca com o
# `person` da sessao, e o worker confere esse prefixo em toda leitura.
#
# o bucket precisa existir antes do primeiro deploy:
#   npx wrangler r2 bucket create merlin-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "merlin-files"

[vars]
# o remetente precisa estar num dominio verificado no Resend.
# o onboarding@resend.dev so entrega no e-mail da propria conta.
SENDER_EMAIL = "merlin@arttreis.com.br"

# quem pode entrar. cada entrada e um endereco inteiro ou um dominio comecado
# por @ — e o dominio que abre o Merlin para o time da Guessless sem um deploy
# por pessoa que entra. qualquer outro e-mail recebe a mesma resposta de
# sucesso e nenhum codigo. vazio libera todo mundo — so para desenvolvimento.
#
# abrir a porta nao e abrir a gaveta: quem entra ganha um Merlin proprio, e as
# consultas do worker nunca cruzam o `person` da sessao. o time divide o
# endereco, o custo e o codigo — nunca o dia, o cliente nem o financeiro.
OWNER_EMAILS = "@guessless.com.br,arthurcastilhos@gmail.com"

# segredos NAO ficam aqui. sao tres, e vao por linha de comando:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put ANTHROPIC_API_KEY   # o Merlin (sugestoes); sem ela a rota responde 503
